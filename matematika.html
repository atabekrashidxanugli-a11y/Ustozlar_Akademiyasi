<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustozlar Akademiyasi - Matematika Bo'limi</title>
    <!-- Supabase kutubxonasi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .categories { display: flex; justify-content: space-around; margin: 20px 0; gap: 10px; flex-wrap: wrap; }
        .cat-btn { padding: 12px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; flex: 1; min-width: 150px; transition: 0.3s; }
        .cat-btn:hover { background: #2980b9; }
        .cat-btn.active { background: #2c3e50; }
        .test-card { background: #fafafa; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .options label { display: block; margin: 10px 0; cursor: pointer; font-size: 16px; }
        .submit-btn { background: #2ecc71; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; display: block; width: 100%; margin-top: 20px; font-weight: bold; }
        .submit-btn:hover { background: #27ae60; }
        .loading, .no-data { text-align: center; font-size: 16px; color: #666; padding: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Bosh sahifaga qaytish</a>
    <h1>Matematika Bo'limi</h1>
    
    <!-- Bo'limlar menyusi -->
    <div class="categories">
        <button class="cat-btn active" onclick="loadTests('darslik', this)">Darsliklar bo'yicha testlar</button>
        <button class="cat-btn" onclick="loadTests('abituryent', this)">Abituryent bo'limi</button>
        <button class="cat-btn" onclick="loadTests('attestatsiya', this)">Attestatsiya bo'limi</button>
    </div>

    <!-- Testlar chiqadigan qism -->
    <div id="test-container">
        <div class="loading">Yuklanmoqda...</div>
    </div>
</div>

<script>
    // Supabase ulanishi
    const SUPABASE_URL = 'https://hrdwtgy6lztrgagw2ajxnq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HRDwTGY6lzTrgagW2ajXnQ_tluf2SSQ';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTests(category, btnElement) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');

        const container = document.getElementById('test-container');
        container.innerHTML = `<div class="loading">Ma'lumotlar yuklanmoqda...</div>`;

        try {
            const { data: tests, error } = await _supabase
                .from('math_tests')
                .select(`id, title, math_questions ( id, question_text, option_a, option_b, option_c, option_d, correct_answer )`)
                .eq('category', category);

            if (error) throw error;

            if (!tests || tests.length === 0) {
                container.innerHTML = `<div class="no-data">Hozircha bu bo'limda testlar mavjud emas.</div>`;
                return;
            }

            let htmlContent = `<h2>${category.toUpperCase()} bo'limi testlari</h2>`;
            
            tests.forEach((test, tIndex) => {
                htmlContent += `<div class="test-card"><h3>${tIndex + 1}. ${test.title}</h3>`;
                
                if (test.math_questions && test.math_questions.length > 0) {
                    test.math_questions.forEach((q, qIndex) => {
                        htmlContent += `
                            <div style="margin-bottom: 15px;">
                                <p><b>${qIndex + 1}) ${q.question_text}</b></p>
                                <div class="options">
                                    <label><input type="radio" name="q_${q.id}" value="A"> A) ${q.option_a}</label>
                                    <label><input type="radio" name="q_${q.id}" value="B"> B) ${q.option_b}</label>
                                    <label><input type="radio" name="q_${q.id}" value="C"> C) ${q.option_c}</label>
                                    <label><input type="radio" name="q_${q.id}" value="D"> D) ${q.option_d}</label>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    htmlContent += `<p>Bu testda hozircha savollar yo'q.</p>`;
                }
                htmlContent += `</div>`;
            });

            htmlContent += `<button class="submit-btn" onclick="checkResults()">Natijalarni tekshirish</button>`;
            container.innerHTML = htmlContent;

        } catch (err) {
            console.error('Xatolik:', err);
            container.innerHTML = `<div class="no-data" style="color: red;">Ma'lumotlarni yuklashda xatolik yuz berdi.</div>`;
        }
    }

    function checkResults() {
        alert("Javoblaringiz qabul qilindi!");
    }

    window.onload = () => {
        const firstBtn = document.querySelector('.cat-btn');
        loadTests('darslik', firstBtn);
    };
</script>

</body>
</html>
