<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 40px 20px; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
      color: #0f172a; 
      min-height: 100vh;
    }

    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 35px; 
      border-radius: 20px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
      border: 1px solid #f1f5f9;
    }

    .btn-back { 
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px; 
      text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; 
    }
    .btn-back:hover { color: #2563eb; }

    h1 { color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; font-size: 26px; }

    .categories { display: flex; justify-content: space-around; margin: 20px 0 10px 0; gap: 8px; flex-wrap: wrap; }
    .cat-btn { padding: 12px 18px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; flex: 1; min-width: 130px; transition: 0.3s; }
    .cat-btn:hover { background: #2980b9; }
    .cat-btn.active { background: #1d4ed8; }

    .sub-menu { display: flex; gap: 8px; margin: 15px 0 25px 0; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
    .sub-btn { padding: 8px 14px; background: #e2e8f0; color: #334155; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
    .sub-btn:hover { background: #cbd5e1; }
    .sub-btn.active { background: #0f172a; color: white; }

    .section-header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin: 25px 0 15px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .material-card, .test-card { 
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; 
      padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .material-card h3 { margin: 0 0 8px 0; color: #0284c7; font-size: 17px; }
    .test-card h3 { margin: 0 0 15px 0; color: #1d4ed8; font-size: 18px; }

    .btn-download {
      display: inline-block;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }
    .btn-download:hover { background: #0369a1; }

    .submit-btn { background: #2563eb; color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; display: block; width: 100%; margin-top: 20px; font-weight: bold; }
    .submit-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    
    <div id="math-categories" style="display: none;">
      <div class="categories">
        <button id="btn-darslik" class="cat-btn active" onclick="switchCategory('darslik', this)">Darsliklar bo'yicha</button>
        <button id="btn-abituryent" class="cat-btn" onclick="switchCategory('abituryent', this)">Abituryent bo'limi</button>
        <button id="btn-attestatsiya" class="cat-btn" onclick="switchCategory('attestatsiya', this)">Attestatsiya bo'limi</button>
      </div>

      <!-- Darslik sinflari -->
      <div id="grades-menu" class="sub-menu">
        <button class="sub-btn active" onclick="selectSubFilter('grade', 5, this)">5-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 6, this)">6-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 7, this)">7-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 8, this)">8-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 9, this)">9-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 10, this)">10-sinf</button>
        <button class="sub-btn" onclick="selectSubFilter('grade', 11, this)">11-sinf</button>
      </div>

      <!-- Abituryent yo'nalishlari -->
      <div id="abituryent-menu" class="sub-menu" style="display: none;">
        <button class="sub-btn active" onclick="selectSubFilter('topic', 'all', this)">Barcha mavzular</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'algebra', this)">Algebra va sonlar</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'geometriya', this)">Geometriya</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'funksiya', this)">Funksiyalar va grafiklar</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'trigonometriya', this)">Trigonometriya</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'dtm_variant', this)">DTM Namunaviy variantlar</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'majburiy', this)">Majburiy fan bloki</button>
      </div>

      <!-- Attestatsiya toifalari -->
      <div id="attestatsiya-menu" class="sub-menu" style="display: none;">
        <button class="sub-btn active" onclick="selectSubFilter('topic', 'all', this)">Barcha materiallar va testlar</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', '2_toifa', this)">2-toifa (Mutaxassis)</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', '1_toifa', this)">1-toifa</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'oliy_toifa', this)">Oliy toifa</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'pedagogika', this)">Pedagogik mahorat</button>
        <button class="sub-btn" onclick="selectSubFilter('topic', 'attestatsiya_variant', this)">Namunaviy variantlar</button>
      </div>
    </div>

    <div id="content-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    let currentCategory = 'darslik';

    async function loadFanData() {
      try {
        const { data: fan } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan && fan.nomi.toLowerCase().includes('matematika')) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " materiallari va testlari";
          document.getElementById('math-categories').style.display = 'block';
          switchCategory('darslik');
        } else {
          if (fan) document.getElementById('fan-nomi').innerText = fan.nomi + " materiallari";
          loadRegularMaterials();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function switchCategory(category, btnElement) {
      if (btnElement) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }
      
      currentCategory = category;
      const gradesMenu = document.getElementById('grades-menu');
      const abituryentMenu = document.getElementById('abituryent-menu');
      const attestatsiyaMenu = document.getElementById('attestatsiya-menu');

      gradesMenu.style.display = 'none';
      abituryentMenu.style.display = 'none';
      attestatsiyaMenu.style.display = 'none';

      if (category === 'darslik') {
        gradesMenu.style.display = 'flex';
        resetActiveSubButtons(gradesMenu);
        loadFullSectionData('darslik', { grade: 5 });
      } else if (category === 'abituryent') {
        abituryentMenu.style.display = 'flex';
        resetActiveSubButtons(abituryentMenu);
        loadFullSectionData('abituryent', { topic: 'all' });
      } else if (category === 'attestatsiya') {
        attestatsiyaMenu.style.display = 'flex';
        resetActiveSubButtons(attestatsiyaMenu);
        loadFullSectionData('attestatsiya', { topic: 'all' });
      }
    }

    function resetActiveSubButtons(menuContainer) {
      menuContainer.querySelectorAll('.sub-btn').forEach((btn, index) => {
        if (index === 0) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    function selectSubFilter(type, value, btnElement) {
      const parent = btnElement.parentElement;
      parent.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      
      if (type === 'grade') {
        loadFullSectionData('darslik', { grade: value });
      } else if (type === 'topic') {
        loadFullSectionData(currentCategory, { topic: value });
      }
    }

    async function loadFullSectionData(category, filterOptions) {
      const container = document.getElementById('content-container');
      container.innerHTML = `<p style="text-align: center; color: #64748b;">Ma'lumotlar yuklanmoqda...</p>`;

      try {
        // 1. Materiallarni olish
        let matQuery = _supabase.from('materials').select('*').eq('fan_id', fanId);
        if (category === 'darslik' && filterOptions.grade) {
          matQuery = matQuery.eq('grade', filterOptions.grade);
        } else if (category === 'abituryent' || category === 'attestatsiya') {
          matQuery = matQuery.eq('category', category);
          if (filterOptions.topic && filterOptions.topic !== 'all') {
            matQuery = matQuery.eq('topic', filterOptions.topic);
          }
        }
        const { data: materials } = await matQuery;

        // 2. Testlarni olish
        let testQuery = _supabase.from('math_tests').select('*').eq('category', category);
        if (category === 'darslik' && filterOptions.grade) {
          testQuery = testQuery.eq('grade', filterOptions.grade);
        } else if ((category === 'abituryent' || category === 'attestatsiya') && filterOptions.topic && filterOptions.topic !== 'all') {
          testQuery = testQuery.eq('topic', filterOptions.topic);
        }
        const { data: tests } = await testQuery;

        // 3. Savollarni olish
        let questions = [];
        if (tests && tests.length > 0) {
          const testIds = tests.map(t => t.id);
          const { data: qData } = await _supabase.from('math_questions').select('*').in('test_id', testIds);
          questions = qData || [];
        }

        let fullHtml = ``;

        // A) Qo'llanmalar/materiallar bloki
        if (materials && materials.length > 0) {
          fullHtml += `<div class="section-header-title">📖 O'quv qo'llanmalari va materiallar</div>`;
          materials.forEach(mat => {
            fullHtml += `
              <div class="material-card">
                <h3>${mat.sarlavha}</h3>
                <p style="color: #475569; margin: 4px 0 10px 0;">${mat.tavsif || ''}</p>
                <a href="${mat.url}" target="_blank" class="btn-download">Faylni yuklab olish 📥</a>
              </div>
            `;
          });
        }

        // B) Testlar bloki
        if (tests && tests.length > 0) {
          fullHtml += `<div class="section-header-title">✍️ Amaliy sinov testlari</div>`;
          tests.forEach((test, tIndex) => {
            const testQuestions = questions.filter(q => q.test_id === test.id);
            fullHtml += `
              <div class="test-card">
                <h3>${tIndex + 1}. ${test.title}</h3>
            `;
            if (testQuestions.length > 0) {
              testQuestions.forEach((q, qIndex) => {
                fullHtml += `
                  <div style="margin-bottom: 18px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 10px;">
                    <p style="font-weight: 600; margin-bottom: 8px;">${qIndex + 1}) ${q.question_text}</p>
                    <div style="margin-left: 10px;">
                      <label style="display:block; margin:5px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="A"> A) ${q.option_a}</label>
                      <label style="display:block; margin:5px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="B"> B) ${q.option_b}</label>
                      <label style="display:block; margin:5px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="C"> C) ${q.option_c}</label>
                      <label style="display:block; margin:5px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="D"> D) ${q.option_d}</label>
                    </div>
                  </div>
                `;
              });
            } else {
              fullHtml += `<p style="color: #64748b;">Ushbu testga hali savollar qo'shilmagan.</p>`;
            }
            fullHtml += `</div>`;
          });
          fullHtml += `<button class="submit-btn" onclick="alert('Natijalaringiz qabul qilindi!')">Natijalarni tekshirish</button>`;
        }

        if ((!materials || materials.length === 0) && (!tests || tests.length === 0)) {
          fullHtml = `<p style="text-align: center; color: #64748b; padding: 30px;">Hozircha ushbu yo'nalishda qo'llanma yoki testlar mavjud emas.</p>`;
        }

        container.innerHTML = fullHtml;

      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="color: red; text-align: center;">Ma'lumotlarni yuklashda xatolik yuz berdi.</p>`;
      }
    }

    async function loadRegularMaterials() {
      const container = document.getElementById('content-container');
      try {
        const { data: materials } = await _supabase.from('materials').select('*').eq('fan_id', fanId);
        if (materials && materials.length > 0) {
          container.innerHTML = materials.map(item => `
            <div class="material-card">
              <h3>${item.sarlavha}</h3>
              <p style="color: #475569;">${item.tavsif || ''}</p>
              <a href="${item.url}" target="_blank" class="btn-download">Faylni ochish 📥</a>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center; color:#64748b;">Hozircha materiallar mavjud emas.</p>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    loadFanData();
  </script>
</body>
</html>
