<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: sans-serif; margin: 40px; background-color: #f4f6f8; color: #1e293b; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .material-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .material-card h3 { margin: 0 0 8px 0; color: #2563eb; }
    .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #475569; font-weight: bold; }
    .btn-download { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #2563eb; color: white; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    // Supabase obyektini to'g'ri bog'lash
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // URL-dan fan ID-sini olish (masalan: fan.html?id=1)
    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    async function loadMaterials() {
      const container = document.getElementById('materials-container');

      try {
        // 1. Fan nomini olish
        const { data: fan, error: fanError } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " fanidan materiallar";
        }

        // 2. Ushbu fanga tegishli materiallarni yuklash
        const { data: materials, error: matError } = await _supabase
          .from('materials')
          .select('*')
          .eq('fan_id', fanId);

        if (matError) throw matError;

        if (materials && materials.length > 0) {
          container.innerHTML = '';
          materials.forEach(item => {
            container.innerHTML += `
              <div class="material-card">
                <h3>${item.sarlavha || 'Material'}</h3>
                <p><strong>Mavzu:</strong> ${item.mavzu || '-'}</p>
                ${item.tavsif ? `<p>${item.tavsif}</p>` : ''}
                ${item.url ? `<a href="${item.url}" target="_blank" class="btn-download">Faylni ko'rish / Yuklab olish</a>` : ''}
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p>Ushbu fan uchun hozircha materiallar mavjud emas.</p>';
        }

      } catch (err) {
        console.error("Xatolik yuz berdi:", err.message);
        container.innerHTML = '<p style="color:red">Ma\'lumotlarni yuklashda xatolik yuz berdi. Console oynasini tekshiring.</p>';
      }
    }

    loadMaterials();
  </script>
</body>
</html>
