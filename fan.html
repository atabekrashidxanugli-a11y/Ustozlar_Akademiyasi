<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 40px 20px; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
      color: #0f172a; 
      min-height: 100vh;
    }

    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 35px; 
      border-radius: 20px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
      border: 1px solid #f1f5f9;
    }

    .btn-back { 
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px; 
      text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; 
    }
    .btn-back:hover { color: #2563eb; }

    h1 { color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; font-size: 26px; }

    /* Asosiy bo'limlar (Darslik, Abituryent, Attestatsiya) */
    .categories { display: flex; justify-content: space-around; margin: 20px 0; gap: 8px; flex-wrap: wrap; }
    .cat-btn { padding: 12px 18px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; flex: 1; min-width: 130px; transition: 0.3s; }
    .cat-btn:hover { background: #2980b9; }
    .cat-btn.active { background: #1d4ed8; }

    /* Sinflar menyusi (5-sinfdan 11-sinfgacha) */
    .grades-container { display: flex; gap: 6px; margin: 15px 0 25px 0; overflow-x: auto; padding-bottom: 5px; }
    .grade-btn { padding: 8px 14px; background: #e2e8f0; color: #334155; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
    .grade-btn:hover { background: #cbd5e1; }
    .grade-btn.active { background: #0f172a; color: white; }

    .material-card, .test-card { 
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; 
      padding: 24px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .test-card h3 { margin: 0 0 10px 0; color: #1d4ed8; font-size: 18px; }
    .submit-btn { background: #2563eb; color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; display: block; width: 100%; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    
    <!-- Matematika uchun asosiy menyu -->
    <div id="math-categories" style="display: none;">
      <div class="categories">
        <button class="cat-btn active" onclick="switchCategory('darslik', this)">Darsliklar bo'yicha</button>
        <button class="cat-btn" onclick="switchCategory('abituryent', this)">Abituryent bo'limi</button>
        <button class="cat-btn" onclick="switchCategory('attestatsiya', this)">Attestatsiya bo'limi</button>
      </div>

      <!-- Sinflar tanlash paneli (Faqat darslik bo'limida chiqadi) -->
      <div id="grades-menu" class="grades-container" style="display: none;">
        <button class="grade-btn active" onclick="loadMathTests('darslik', 5, this)">5-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 6, this)">6-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 7, this)">7-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 8, this)">8-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 9, this)">9-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 10, this)">10-sinf</button>
        <button class="grade-btn" onclick="loadMathTests('darslik', 11, this)">11-sinf</button>
      </div>
    </div>

    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CHANNEL_URL = "https://t.me/ustozlarakademiyasi1996"; 

    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    let currentCategory = 'darslik';

    async function loadFanData() {
      const container = document.getElementById('materials-container');
      try {
        const { data: fan } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " materiallari va testlari";
          
          if (fan.nomi.toLowerCase().includes('matematika')) {
            document.getElementById('math-categories').style.display = 'block';
            document.getElementById('grades-menu').style.display = 'flex';
            loadMathTests('darslik', 5); // Standart 5-sinfdan boshlanadi
            return;
          }
        }
        loadRegularMaterials();
      } catch (err) {
        container.innerHTML = '<p style="color:red">Xatolik yuz berdi.</p>';
      }
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      currentCategory = category;

      const gradesMenu = document.getElementById('grades-menu');
      if (category === 'darslik') {
        gradesMenu.style.display = 'flex';
        loadMathTests('darslik', 5);
      } else {
        gradesMenu.style.display = 'none';
        loadMathTests(category, null);
      }
    }

    async function loadMathTests(category, grade, btnElement) {
      if (btnElement) {
        document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
      }

      const container = document.getElementById('materials-container');
      container.innerHTML = `<p style="text-align: center;">Testlar yuklanmoqda...</p>`;

      try {
        let query = _supabase
          .from('math_tests')
          .select(`id, title, grade, category, math_questions ( id, question_text, option_a, option_b, option_c, option_d, correct_answer )`)
          .eq('category', category);

        if (category === 'darslik' && grade) {
          query = query.eq('grade', grade);
        }

        const { data: tests, error } = await query;
        if (error) throw error;

        if (!tests || tests.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: #666; padding: 20px;">Hozircha bu sinfda testlar mavjud emas.</p>`;
          return;
        }

        let htmlContent = ``;
        tests.forEach((test, tIndex) => {
          htmlContent += `<div class="test-card"><h3>${tIndex + 1}. ${test.title}</h3>`;
          if (test.math_questions && test.math_questions.length > 0) {
            test.math_questions.forEach((q, qIndex) => {
              htmlContent += `
                <div style="margin-bottom: 15px;">
                  <p><b>${qIndex + 1}) ${q.question_text}</b></p>
                  <div style="margin-left: 15px;">
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="A"> A) ${q.option_a}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="B"> B) ${q.option_b}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="C"> C) ${q.option_c}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="D"> D) ${q.option_d}</label>
                  </div>
                </div>
              `;
            });
          } else {
            htmlContent += `<p>Bu testda hozircha savollar yo'q.</p>`;
          }
          htmlContent += `</div>`;
        });

        htmlContent += `<button class="submit-btn" onclick="alert('Natijalaringiz qabul qilindi!')">Natijalarni tekshirish</button>`;
        container.innerHTML = htmlContent;

      } catch (err) {
        container.innerHTML = `<p style="color: red; text-align: center;">Testlarni yuklashda xatolik yuz berdi.</p>`;
      }
    }

    async function loadRegularMaterials() {
      const container = document.getElementById('materials-container');
      const { data: materials } = await _supabase.from('materials').select('*').eq('fan_id', fanId);
      if (materials && materials.length > 0) {
        container.innerHTML = materials.map(item => `
          <div class="material-card">
            <h3>${item.sarlavha}</h3>
            <p>${item.tavsif || ''}</p>
            <a href="${item.url}" target="_blank" class="submit-btn" style="text-align:center; text-decoration:none;">Faylni ochish</a>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<p>Materiallar mavjud emas.</p>';
      }
    }

    loadFanData();
  </script>
</body>
</html>
