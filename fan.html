<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: sans-serif; margin: 40px; background-color: #f4f6f8; color: #1e293b; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .material-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .material-card h3 { margin: 0 0 8px 0; color: #2563eb; }
    .file-preview { width: 100%; height: 350px; border: 1px solid #cbd5e1; border-radius: 6px; margin-top: 10px; }
    .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #475569; font-weight: bold; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn-subscribe { display: inline-block; padding: 10px 18px; background: #0088cc; color: white; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; }
    .btn-subscribe:hover { background: #0077b3; }
    .btn-check { display: inline-block; padding: 10px 18px; background: #16a34a; color: white; border-radius: 6px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-check:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // Sizning aniq Telegram kanalingiz havolasi
    const CHANNEL_URL = "https://t.me/ustozlarakademiyasi1996"; 

    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    // Obunani tasdiqlatib faylni ochish
    function openFileWithCheck(fileUrl) {
      if (!fileUrl) {
        alert("Fayl havolasi topilmadi!");
        return;
      }
      
      let isSubscribed = confirm("Kanalimizga obuna bo'ldingizmi?\n\n'OK' tugmasini bosing va to'liq fayl ochiladi.");
      if (isSubscribed) {
        window.open(fileUrl, '_blank');
      } else {
        window.open(CHANNEL_URL, '_blank');
      }
    }

    async function loadMaterials() {
      const container = document.getElementById('materials-container');

      try {
        const { data: fan } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " fanidan materiallar";
        }

        const { data: materials, error: matError } = await _supabase
          .from('materials')
          .select('*')
          .eq('fan_id', fanId);

        if (matError) throw matError;

        if (materials && materials.length > 0) {
          container.innerHTML = '';
          materials.forEach(item => {
            let previewHtml = '';
            if (item.url) {
              previewHtml = `<iframe src="https://docs.google.com/gview?url=${encodeURIComponent(item.url)}&embedded=true" class="file-preview"></iframe>`;
            }

            container.innerHTML += `
              <div class="material-card">
                <h3>${item.sarlavha || 'Material'}</h3>
                <p><strong>Mavzu:</strong> ${item.mavzu || '-'}</p>
                ${item.tavsif ? `<p>${item.tavsif}</p>` : ''}
                ${previewHtml}
                
                ${item.url ? `
                  <div class="btn-group">
                    <a href="${CHANNEL_URL}" target="_blank" class="btn-subscribe">📢 Kanalga obuna bo'lish</a>
                    <button onclick="openFileWithCheck('${item.url}')" class="btn-check">✅ Obunani tekshirish / Faylni ko'rish</button>
                  </div>
                ` : ''}
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p>Ushbu fan uchun hozircha materiallar mavjud emas.</p>';
        }

      } catch (err) {
        console.error("Xatolik yuz berdi:", err.message);
        container.innerHTML = '<p style="color:red">Ma\'lumotlarni yuklashda xatolik yuz berdi.</p>';
      }
    }

    loadMaterials();
  </script>
</body>
</html>
