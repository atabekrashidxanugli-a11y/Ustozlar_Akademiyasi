<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 40px 20px; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
      color: #0f172a; 
      min-height: 100vh;
    }

    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 35px; 
      border-radius: 20px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
      border: 1px solid #f1f5f9;
    }

    .btn-back { 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      margin-bottom: 24px; 
      text-decoration: none; 
      color: #64748b; 
      font-weight: 600; 
      font-size: 14px; 
      transition: all 0.2s ease; 
    }
    .btn-back:hover { color: #2563eb; transform: translateX(-3px); }

    h1 { 
      color: #0f172a; 
      border-bottom: 2px solid #f1f5f9; 
      padding-bottom: 16px; 
      font-size: 26px; 
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .material-card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 16px; 
      padding: 24px; 
      margin-bottom: 25px; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .material-card:hover {
      box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    .material-card h3 { 
      margin: 0 0 10px 0; 
      color: #1d4ed8; 
      font-size: 20px; 
      font-weight: 600; 
    }
    .material-card p { margin: 6px 0; color: #475569; font-size: 15px; }

    .file-preview { 
      width: 100%; 
      height: 400px; 
      border: 1px solid #cbd5e1; 
      border-radius: 12px; 
      margin-top: 16px; 
      background: #f8fafc; 
    }

    /* PREMIUM TUGMALAR DİZAYNI */
    .btn-group { display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap; }

    .btn-subscribe { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      gap: 8px;
      padding: 12px 24px; 
      background: linear-gradient(135deg, #0088cc 0%, #006699 100%); 
      color: white; 
      border-radius: 12px; 
      text-decoration: none; 
      font-size: 15px; 
      font-weight: 600; 
      box-shadow: 0 4px 14px rgba(0, 136, 204, 0.35);
      transition: all 0.25s ease;
      border: none;
    }
    .btn-subscribe:hover { 
      background: linear-gradient(135deg, #0099ee 0%, #0077bb 100%); 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.45);
    }

    .btn-check { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center;
      gap: 8px;
      padding: 12px 24px; 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
      color: white; 
      border-radius: 12px; 
      border: none; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.25s ease;
    }
    .btn-check:hover { 
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%); 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    .btn-subscribe:active, .btn-check:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CHANNEL_URL = "https://t.me/ustozlarakademiyasi1996"; 

    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    function openFileWithCheck(fileUrl) {
      if (!fileUrl) {
        alert("Fayl havolasi topilmadi!");
        return;
      }
      
      let isSubscribed = confirm("Kanalimizga obuna bo'ldingizmi?\n\n'OK' tugmasini bosing va to'liq fayl ochiladi.");
      if (isSubscribed) {
        window.open(fileUrl, '_blank');
      } else {
        window.open(CHANNEL_URL, '_blank');
      }
    }

    async function loadMaterials() {
      const container = document.getElementById('materials-container');

      try {
        const { data: fan } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " fanidan materiallar";
        }

        const { data: materials, error: matError } = await _supabase
          .from('materials')
          .select('*')
          .eq('fan_id', fanId);

        if (matError) throw matError;

        if (materials && materials.length > 0) {
          container.innerHTML = '';
          materials.forEach(item => {
            let previewHtml = '';
            if (item.url) {
              previewHtml = `<iframe src="https://docs.google.com/gview?url=${encodeURIComponent(item.url)}&embedded=true" class="file-preview"></iframe>`;
            }

            container.innerHTML += `
              <div class="material-card">
                <h3>${item.sarlavha || 'Material'}</h3>
                <p><strong>Mavzu:</strong> ${item.mavzu || '-'}</p>
                ${item.tavsif ? `<p>${item.tavsif}</p>` : ''}
                ${previewHtml}
                
                ${item.url ? `
                  <div class="btn-group">
                    <a href="${CHANNEL_URL}" target="_blank" class="btn-subscribe">📢 Kanalga obuna bo'lish</a>
                    <button onclick="openFileWithCheck('${item.url}')" class="btn-check">✅ Obunani tekshirish / Faylni ko'rish</button>
                  </div>
                ` : ''}
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p>Ushbu fan uchun hozircha materiallar mavjud emas.</p>';
        }

      } catch (err) {
        console.error("Xatolik yuz berdi:", err.message);
        container.innerHTML = '<p style="color:red">Ma\'lumotlarni yuklashda xatolik yuz berdi.</p>';
      }
    }

    loadMaterials();
  </script>
</body>
</html>
