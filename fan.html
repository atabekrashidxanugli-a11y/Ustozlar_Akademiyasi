<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f1f5f9; color: #1e293b; }
    .container { max-width: 850px; margin: 0 auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h1 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; font-size: 24px; }
    
    /* Yangilangan chiroyli to'rtburchak (kartochka) dizayni */
    .material-card { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 25px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: all 0.2s ease-in-out;
    }
    .material-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
      border-color: #cbd5e1;
    }
    .material-card h3 { margin: 0 0 10px 0; color: #2563eb; font-size: 18px; }
    .material-card p { margin: 6px 0; color: #475569; font-size: 14px; }
    
    /* Hujjat oynasi (iframe) */
    .file-preview { width: 100%; height: 380px; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 12px; background: #f8fafc; }
    
    /* Bosh sahifaga qaytish tugmasi */
    .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; transition: color 0.2s; }
    .btn-back:hover { color: #2563eb; }
    
    /* Tugmalar guruhi */
    .btn-group { display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
    .btn-subscribe { 
      display: inline-flex; 
      align-items: center; 
      padding: 10px 20px; 
      background: #0088cc; 
      color: white; 
      border-radius: 8px; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 600; 
      transition: background 0.2s; 
    }
    .btn-subscribe:hover { background: #0077b3; }
    .btn-check { 
      display: inline-flex; 
      align-items: center; 
      padding: 10px 20px; 
      background: #16a34a; 
      color: white; 
      border-radius: 8px; 
      border: none; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: background 0.2s; 
    }
    .btn-check:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CHANNEL_URL = "https://t.me/ustozlarakademiyasi1996"; 

    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    function openFileWithCheck(fileUrl) {
      if (!fileUrl) {
        alert("Fayl havolasi topilmadi!");
        return;
      }
      
      let isSubscribed = confirm("Kanalimizga obuna bo'ldingizmi?\n\n'OK' tugmasini bosing va to'liq fayl ochiladi.");
      if (isSubscribed) {
        window.open(fileUrl, '_blank');
      } else {
        window.open(CHANNEL_URL, '_blank');
      }
    }

    async function loadMaterials() {
      const container = document.getElementById('materials-container');

      try {
        const { data: fan } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (fan) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " fanidan materiallar";
        }

        const { data: materials, error: matError } = await _supabase
          .from('materials')
          .select('*')
          .eq('fan_id', fanId);

        if (matError) throw matError;

        if (materials && materials.length > 0) {
          container.innerHTML = '';
          materials.forEach(item => {
            let previewHtml = '';
            if (item.url) {
              previewHtml = `<iframe src="https://docs.google.com/gview?url=${encodeURIComponent(item.url)}&embedded=true" class="file-preview"></iframe>`;
            }

            container.innerHTML += `
              <div class="material-card">
                <h3>${item.sarlavha || 'Material'}</h3>
                <p><strong>Mavzu:</strong> ${item.mavzu || '-'}</p>
                ${item.tavsif ? `<p>${item.tavsif}</p>` : ''}
                ${previewHtml}
                
                ${item.url ? `
                  <div class="btn-group">
                    <a href="${CHANNEL_URL}" target="_blank" class="btn-subscribe">📢 Kanalga obuna bo'lish</a>
                    <button onclick="openFileWithCheck('${item.url}')" class="btn-check">✅ Obunani tekshirish / Faylni ko'rish</button>
                  </div>
                ` : ''}
              </div>
            `;
          });
        } else {
          container.innerHTML = '<p>Ushbu fan uchun hozircha materiallar mavjud emas.</p>';
        }

      } catch (err) {
        console.error("Xatolik yuz berdi:", err.message);
        container.innerHTML = '<p style="color:red">Ma\'lumotlarni yuklashda xatolik yuz berdi.</p>';
      }
    }

    loadMaterials();
  </script>
</body>
</html>
