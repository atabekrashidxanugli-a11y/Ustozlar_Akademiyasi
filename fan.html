<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Materiallari — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 40px 20px; 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
      color: #0f172a; 
      min-height: 100vh;
    }

    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #ffffff; 
      padding: 35px; 
      border-radius: 20px; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); 
      border: 1px solid #f1f5f9;
    }

    .btn-back { 
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px; 
      text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; 
    }
    .btn-back:hover { color: #2563eb; }

    h1 { color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; font-size: 26px; }

    /* Asosiy bo'limlar */
    .categories { display: flex; justify-content: space-around; margin: 20px 0 10px 0; gap: 8px; flex-wrap: wrap; }
    .cat-btn { padding: 12px 18px; background: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; flex: 1; min-width: 130px; transition: 0.3s; }
    .cat-btn:hover { background: #2980b9; }
    .cat-btn.active { background: #1d4ed8; }

    /* Sinflar paneli */
    .grades-container { display: flex; gap: 8px; margin: 15px 0 25px 0; overflow-x: auto; padding-bottom: 5px; }
    .grade-btn { padding: 8px 16px; background: #e2e8f0; color: #334155; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
    .grade-btn:hover { background: #cbd5e1; }
    .grade-btn.active { background: #0f172a; color: white; }

    .test-card, .material-card { 
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; 
      padding: 24px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .test-card h3 { margin: 0 0 15px 0; color: #1d4ed8; font-size: 18px; }
    .submit-btn { background: #2563eb; color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; display: block; width: 100%; margin-top: 20px; font-weight: bold; }
    .submit-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1 id="fan-nomi">Fan materiallari</h1>
    
    <!-- Matematika bo'limlari -->
    <div id="math-categories" style="display: none;">
      <div class="categories">
        <button id="btn-darslik" class="cat-btn active" onclick="switchCategory('darslik', this)">Darsliklar bo'yicha</button>
        <button id="btn-abituryent" class="cat-btn" onclick="switchCategory('abituryent', this)">Abituryent bo'limi</button>
        <button id="btn-attestatsiya" class="cat-btn" onclick="switchCategory('attestatsiya', this)">Attestatsiya bo'limi</button>
      </div>

      <!-- Faqat darslik tanlanganda ochiladi -->
      <div id="grades-menu" class="grades-container">
        <button class="grade-btn active" onclick="selectGrade(5, this)">5-sinf</button>
        <button class="grade-btn" onclick="selectGrade(6, this)">6-sinf</button>
        <button class="grade-btn" onclick="selectGrade(7, this)">7-sinf</button>
        <button class="grade-btn" onclick="selectGrade(8, this)">8-sinf</button>
        <button class="grade-btn" onclick="selectGrade(9, this)">9-sinf</button>
        <button class="grade-btn" onclick="selectGrade(10, this)">10-sinf</button>
        <button class="grade-btn" onclick="selectGrade(11, this)">11-sinf</button>
      </div>
    </div>

    <div id="materials-container">Yuklanmoqda...</div>
  </div>

  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const urlParams = new URLSearchParams(window.location.search);
    const fanId = urlParams.get('id') || 1;

    let currentCategory = 'darslik';
    let currentGrade = 5;

    async function loadFanData() {
      const container = document.getElementById('materials-container');
      try {
        const { data: fan, error } = await _supabase
          .from('fanlar')
          .select('nomi')
          .eq('id', fanId)
          .maybeSingle();

        if (error) console.error("Fan yuklashda xato:", error);

        if (fan && fan.nomi.toLowerCase().includes('matematika')) {
          document.getElementById('fan-nomi').innerText = fan.nomi + " materiallari va testlari";
          document.getElementById('math-categories').style.display = 'block';
          document.getElementById('grades-menu').style.display = 'flex';
          loadMathTests('darslik', 5);
        } else {
          if (fan) document.getElementById('fan-nomi').innerText = fan.nomi + " materiallari";
          loadRegularMaterials();
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red; text-align:center;">Ma\'lumotlarni yuklashda xatolik yuz berdi.</p>';
      }
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      
      currentCategory = category;
      const gradesMenu = document.getElementById('grades-menu');

      if (category === 'darslik') {
        gradesMenu.style.display = 'flex';
        loadMathTests('darslik', currentGrade);
      } else {
        gradesMenu.style.display = 'none';
        loadMathTests(category, null);
      }
    }

    function selectGrade(grade, btnElement) {
      document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      
      currentGrade = grade;
      loadMathTests('darslik', grade);
    }

    async function loadMathTests(category, grade) {
      const container = document.getElementById('materials-container');
      container.innerHTML = `<p style="text-align: center; color: #64748b;">Testlar yuklanmoqda...</p>`;

      try {
        // 1. Testlarni olish
        let query = _supabase.from('math_tests').select('*').eq('category', category);
        if (category === 'darslik' && grade) {
          query = query.eq('grade', grade);
        }

        const { data: tests, error: testError } = await query;
        if (testError) throw testError;

        if (!tests || tests.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: #64748b; padding: 20px;">Hozircha ushbu bo'limda testlar mavjud emas.</p>`;
          return;
        }

        // 2. Test savollarini olish
        const testIds = tests.map(t => t.id);
        const { data: questions, error: qError } = await _supabase
          .from('math_questions')
          .select('*')
          .in('test_id', testIds);

        if (qError) throw qError;

        let htmlContent = ``;
        tests.forEach((test, tIndex) => {
          const testQuestions = (questions || []).filter(q => q.test_id === test.id);

          htmlContent += `
            <div class="test-card">
              <h3>${tIndex + 1}. ${test.title || 'Mavzulashtirilgan test'}</h3>
          `;

          if (testQuestions.length > 0) {
            testQuestions.forEach((q, qIndex) => {
              htmlContent += `
                <div style="margin-bottom: 20px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 12px;">
                  <p style="font-weight: 600; margin-bottom: 8px;">${qIndex + 1}) ${q.question_text}</p>
                  <div style="margin-left: 10px;">
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="A"> A) ${q.option_a}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="B"> B) ${q.option_b}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="C"> C) ${q.option_c}</label>
                    <label style="display:block; margin:6px 0; cursor:pointer;"><input type="radio" name="q_${q.id}" value="D"> D) ${q.option_d}</label>
                  </div>
                </div>
              `;
            });
          } else {
            htmlContent += `<p style="color: #64748b;">Ushbu testga hali savollar biriktirilmagan.</p>`;
          }

          htmlContent += `</div>`;
        });

        htmlContent += `<button class="submit-btn" onclick="alert('Natijalaringiz qabul qilindi!')">Natijalarni tekshirish</button>`;
        container.innerHTML = htmlContent;

      } catch (err) {
        console.error("Xatolik tafsiloti:", err);
        container.innerHTML = `<p style="color: red; text-align: center;">Testlarni yuklashda xatolik yuz berdi. (Konsolni tekshiring)</p>`;
      }
    }

    async function loadRegularMaterials() {
      const container = document.getElementById('materials-container');
      try {
        const { data: materials, error } = await _supabase.from('materials').select('*').eq('fan_id', fanId);
        if (error) throw error;

        if (materials && materials.length > 0) {
          container.innerHTML = materials.map(item => `
            <div class="material-card">
              <h3 style="margin-top:0;">${item.sarlavha}</h3>
              <p style="color: #475569;">${item.tavsif || ''}</p>
              <a href="${item.url}" target="_blank" class="submit-btn" style="text-align:center; text-decoration:none;">Faylni ochish</a>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center; color:#64748b;">Hozircha materiallar mavjud emas.</p>';
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:red; text-align:center;">Materiallarni yuklashda xatolik yuz berdi.</p>';
      }
    }

    loadFanData();
  </script>
</body>
</html>
