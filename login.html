<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin kirish</title><style>body{font-family:Arial;background:#f4f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:32px;border-radius:18px;width:min(390px,85%);box-shadow:0 10px 30px #0001}input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #ccd3e0;box-sizing:border-box}button{background:#3157d5;color:#fff;border:0;font-weight:bold}.err{color:#c62828}</style></head><body><div class="box"><h2>🔐 Rahbar/Admin kirishi</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Parol"><button id="login">Kirish</button><p id="msg" class="err"></p><a href="index.html">← Bosh sahifa</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value,password=document.getElementById('password').value;const {error}=await db.auth.signInWithPassword({email,password});if(error)document.getElementById('msg').textContent=error.message;else location.href='admin.html'};</script></body></html>
