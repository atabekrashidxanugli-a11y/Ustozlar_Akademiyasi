<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Ustozlar Akademiyasi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 30px 15px;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      text-decoration: none;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
    }
    .btn-back:hover { color: #2563eb; }

    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    /* Tab Tugmalari */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #2563eb;
      color: white;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 22px;
      color: #0f172a;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2563eb;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-submit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover { background: #1d4ed8; }

    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f8fafc;
    }

    .btn-del {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <a href="index.html" class="btn-back">‹ Bosh sahifaga qaytish</a>
    <button class="btn-logout" onclick="logout()">Chiqish</button>
  </div>

  <!-- Bo'lim tanlash tugmalari -->
  <div class="admin-tabs">
    <button id="tab-material" class="tab-btn active" onclick="switchAdminTab('material')">Fayl Yuklash</button>
    <button id="tab-test" class="tab-btn" onclick="switchAdminTab('test')">Testlar Boshqaruvi</button>
  </div>

  <!-- 1-TAB: MATERIAL VA FAYL YUKLASH -->
  <div id="section-material">
    <div class="card">
      <h2>Yangi material va fayl yuklash</h2>
      <form id="material-form">
        <div class="form-group">
          <label>Fanni tanlang:</label>
          <select id="mat-fan-id" required>
            <option value="">-- Fanni tanlang --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Sarlavha:</label>
          <input type="text" id="mat-sarlavha" placeholder="Masalan: 6-sinf Fizika darslik" required>
        </div>

        <div class="form-group">
          <label>Mavzu:</label>
          <input type="text" id="mat-mavzu" placeholder="Masalan: Zichlik va massa">
        </div>

        <div class="form-group">
          <label>Tavsif (qisqacha):</label>
          <textarea id="mat-tavsif" rows="3" placeholder="Material haqida qo'shimcha ma'lumot..."></textarea>
        </div>

        <div class="form-group">
          <label>Darslik faylini tanlang (PDF, Docx, PPTX):</label>
          <input type="file" id="mat-file" required>
        </div>

        <button type="submit" id="btn-mat-submit" class="btn-submit">Faylni yuklash va saqlash ↗</button>
      </form>
    </div>
  </div>

  <!-- 2-TAB: TESTLAR BOSHQARUVI -->
  <div id="section-test" style="display: none;">
    
    <!-- Test Yaratish -->
    <div class="card">
      <h2>1. Yangi Test Yaratish</h2>
      <form id="test-create-form">
        <div class="form-group">
          <label>Test mavzusi (Sarlavha):</label>
          <input type="text" id="test-title" placeholder="Masalan: 1-Bob. Natural sonlar ustida amallar" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Bo'lim:</label>
            <select id="test-category" onchange="toggleGradeField()">
              <option value="darslik">Darsliklar bo'yicha</option>
              <option value="abituryent">Abituryent bo'limi</option>
              <option value="attestatsiya">Attestatsiya bo'limi</option>
            </select>
          </div>

          <div class="form-group" id="grade-wrapper">
            <label>Sinfni tanlang:</label>
            <select id="test-grade">
              <option value="5">5-sinf</option>
              <option value="6">6-sinf</option>
              <option value="7">7-sinf</option>
              <option value="8">8-sinf</option>
              <option value="9">9-sinf</option>
              <option value="10">10-sinf</option>
              <option value="11">11-sinf</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit">+ Testni Saqlash</button>
      </form>
    </div>

    <!-- Savol Qo'shish -->
    <div class="card">
      <h2>2. Testga Savol Qo'shish</h2>
      <form id="question-create-form">
        <div class="form-group">
          <label>Mavjud Testni Tanlang:</label>
          <select id="target-test-select" required>
            <option value="">Yuklanmoqda...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Savol matni:</label>
          <textarea id="q-text" rows="2" placeholder="Savol matnini kiriting..." required></textarea>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>A varianti:</label>
            <input type="text" id="q-opt-a" required>
          </div>
          <div class="form-group">
            <label>B varianti:</label>
            <input type="text" id="q-opt-b" required>
          </div>
          <div class="form-group">
            <label>C varianti:</label>
            <input type="text" id="q-opt-c" required>
          </div>
          <div class="form-group">
            <label>D varianti:</label>
            <input type="text" id="q-opt-d" required>
          </div>
        </div>

        <div class="form-group">
          <label>To'g'ri javob:</label>
          <select id="q-correct" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">+ Savolni Saqlash</button>
      </form>
    </div>

    <!-- Testlar Ro'yxati -->
    <div class="card">
      <h2>Mavjud Matematika Testlari</h2>
      <div id="tests-list-box">Yuklanmoqda...</div>
    </div>

  </div>
</div>

<script>
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Tablarni almashtirish
  function switchAdminTab(tabName) {
    if (tabName === 'material') {
      document.getElementById('section-material').style.display = 'block';
      document.getElementById('section-test').style.display = 'none';
      document.getElementById('tab-material').classList.add('active');
      document.getElementById('tab-test').classList.remove('active');
    } else {
      document.getElementById('section-material').style.display = 'none';
      document.getElementById('section-test').style.display = 'block';
      document.getElementById('tab-test').classList.add('active');
      document.getElementById('tab-material').classList.remove('active');
      loadTestsData();
    }
  }

  function toggleGradeField() {
    const cat = document.getElementById('test-category').value;
    document.getElementById('grade-wrapper').style.display = (cat === 'darslik') ? 'block' : 'none';
  }

  // Fanlar ro'yxatini yuklash
  async function loadFanlar() {
    const fanSelect = document.getElementById('mat-fan-id');
    try {
      const { data: fanlar, error } = await _supabase.from('fanlar').select('*').order('id');
      if (error) throw error;
      
      fanSelect.innerHTML = '<option value="">-- Fanni tanlang --</option>' + 
        fanlar.map(f => `<option value="${f.id}">${f.nomi}</option>`).join('');
    } catch (e) {
      console.error(e);
    }
  }

  // Fayl yuklash (Materials)
  document.getElementById('material-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-mat-submit');
    btn.innerText = "Yuklanmoqda...";
    btn.disabled = true;

    try {
      const fan_id = document.getElementById('mat-fan-id').value;
      const sarlavha = document.getElementById('mat-sarlavha').value;
      const tavsif = document.getElementById('mat-tavsif').value;
      const fileInput = document.getElementById('mat-file');
      const file = fileInput.files[0];

      if (!file) throw new Error("Fayl tanlanmadi!");

      // 1. Storage ga yuklash
      const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { data: uploadData, error: uploadError } = await _supabase.storage
        .from('materials')
        .upload(fileName, file);

      if (uploadError) throw uploadError;

      const { data: publicUrlData } = _supabase.storage.from('materials').getPublicUrl(fileName);
      const fileUrl = publicUrlData.publicUrl;

      // 2. Bazaga yozish
      const { error: dbError } = await _supabase.from('materials').insert([{
        fan_id: parseInt(fan_id),
        sarlavha: sarlavha,
        tavsif: tavsif,
        url: fileUrl
      }]);

      if (dbError) throw dbError;

      alert("Material va fayl muvaffaqiyatli saqlandi!");
      document.getElementById('material-form').reset();

    } catch (err) {
      alert("Xatolik: " + err.message);
    } finally {
      btn.innerText = "Faylni yuklash va saqlash ↗";
      btn.disabled = false;
    }
  });

  // Testlarni yuklash
  async function loadTestsData() {
    const listDiv = document.getElementById('tests-list-box');
    const selectBox = document.getElementById('target-test-select');

    try {
      const { data: tests, error } = await _supabase.from('math_tests').select('*').order('id', { ascending: false });
      if (error) throw error;

      if (!tests || tests.length === 0) {
        listDiv.innerHTML = "<p style='color:#64748b;'>Hozircha testlar mavjud emas.</p>";
        selectBox.innerHTML = "<option value=''>Avval yangi test yarating</option>";
        return;
      }

      selectBox.innerHTML = '<option value="">-- Testni tanlang --</option>' + 
        tests.map(t => `<option value="${t.id}">${t.title} (${t.category}${t.grade ? ' - ' + t.grade + '-sinf' : ''})</option>`).join('');

      listDiv.innerHTML = tests.map(t => `
        <div class="test-item">
          <div>
            <strong>${t.title}</strong>
            <div style="font-size: 12px; color: #64748b;">${t.category} ${t.grade ? ' | ' + t.grade + '-sinf' : ''}</div>
          </div>
          <button class="btn-del" onclick="deleteTest(${t.id})">O'chirish</button>
        </div>
      `).join('');

    } catch (err) {
      console.error(err);
      listDiv.innerHTML = "<p style='color:red;'>Testlar ro'yxatini yuklab bo'lmadi.</p>";
    }
  }

  // Yangi test yaratish
  document.getElementById('test-create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('test-title').value;
    const category = document.getElementById('test-category').value;
    const grade = (category === 'darslik') ? parseInt(document.getElementById('test-grade').value) : null;

    try {
      const { error } = await _supabase.from('math_tests').insert([{ title, category, grade }]);
      if (error) throw error;

      alert("Yangi test saqlandi!");
      document.getElementById('test-create-form').reset();
      toggleGradeField();
      loadTestsData();
    } catch (err) {
      alert("Xatolik: " + err.message);
    }
  });

  // Savol qo'shish
  document.getElementById('question-create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const test_id = document.getElementById('target-test-select').value;
    const question_text = document.getElementById('q-text').value;
    const option_a = document.getElementById('q-opt-a').value;
    const option_b = document.getElementById('q-opt-b').value;
    const option_c = document.getElementById('q-opt-c').value;
    const option_d = document.getElementById('q-opt-d').value;
    const correct_answer = document.getElementById('q-correct').value;

    if (!test_id) {
      alert("Test tanlanmagan!");
      return;
    }

    try {
      const { error } = await _supabase.from('math_questions').insert([{
        test_id: parseInt(test_id),
        question_text,
        option_a,
        option_b,
        option_c,
        option_d,
        correct_answer
      }]);

      if (error) throw error;

      alert("Savol testga qo'shildi!");
      document.getElementById('q-text').value = '';
      document.getElementById('q-opt-a').value = '';
      document.getElementById('q-opt-b').value = '';
      document.getElementById('q-opt-c').value = '';
      document.getElementById('q-opt-d').value = '';
    } catch (err) {
      alert("Xatolik: " + err.message);
    }
  });

  // Test o'chirish
  async function deleteTest(id) {
    if (!confirm("Test va uning barcha savollarini o'chirishni tasdiqlaysizmi?")) return;
    try {
      await _supabase.from('math_questions').delete().eq('test_id', id);
      await _supabase.from('math_tests').delete().eq('id', id);
      loadTestsData();
    } catch (err) {
      alert("O'chirishda xatolik: " + err.message);
    }
  }

  function logout() {
    window.location.href = "index.html";
  }

  loadFanlar();
</script>
</body>
</html>
