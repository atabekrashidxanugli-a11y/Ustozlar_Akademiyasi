<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Panel - Ustozlar Akademiyasi</title>
  
  <!-- Supabase va Himoya skripti -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Sahifa ochilishi bilanoq admin ekanligini tekshirish
    async function checkAdminAccess() {
      const { data: { session } } = await _supabase.auth.getSession();
      
      // 1. Tizimga kirilmagan bo'lsa, login sahifasiga otib yuborish
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      // 2. Foydalanuvchi roli admin ekanligini bazadan tekshirish
      const { data: profile, error } = await _supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (error || !profile || profile.role !== 'admin') {
        alert("Sizda ushbu sahifaga kirish huquqi yo'q!");
        window.location.href = 'index.html';
      }
    }

    checkAdminAccess();
  </script>

  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: #213b91; }
    button.logout { background: #d9534f; color: #white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; float: right; }
  </style>
</head>
<body>
  <div class="container">
    <button class="logout" onclick="logout()">Chiqish</button>
    <h1>🔐 Admin Panel</h1>
    <p>Xush kelibsiz! Bu yerda fan materiallarini boshqarishingiz mumkin.</p>
    
    <!-- Sizning admin funksiyalaringiz (material qo'shish formasi va hokazo) shu yerda bo'ladi -->
  </div>

  <script>
    async function logout() {
      await _supabase.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
